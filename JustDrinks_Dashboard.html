<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JustDrinks LTD Analytics</title>
<meta name="description" content="Interactive analysis of 12.8 million sales lines and 2.4 million purchase lines for JustDrinks Ltd., an 80-store drinks retailer. Built by Bih Brandy Sango."/>
<meta property="og:title" content="JustDrinks LTD: Live Web Dashboard and Power BI Report"/>
<meta property="og:description" content="Interactive analysis for an 80-store drinks retailer, with a what-if simulator and a 13-page Power BI report. Built by Bih Brandy Sango."/>
<meta property="og:image" content="https://bihbrandysango-cloud.github.io/justdrinks-ltd-analysis/docs/cover.jpg"/>
<meta property="og:url" content="https://bihbrandysango-cloud.github.io/justdrinks-ltd-analysis/JustDrinks_Dashboard.html"/>
<meta property="og:type" content="website"/>
<link rel="icon" href="docs/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --page:#F4F5F8;--card:#FFFFFF;--line:#E4E7ED;--line2:#EEF0F4;
  --tx:#161A21;--tx2:#566072;--tx3:#8791A1;
  --ink:#171C24;--amber:#E39A2D;--amber-tx:#A9690C;--amber-bg:#FCF3E3;
  --slate:#6B7FB3;--red:#C0392B;--red-bg:#FBECEA;--green:#1B8A57;--green-bg:#E7F5EE;
  --shadow:0 1px 2px rgba(23,28,36,.04),0 8px 24px rgba(23,28,36,.06);
  --r:14px;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme=dark]{
  --page:#0E1116;--card:#171B22;--line:#2A303A;--line2:#222730;
  --tx:#F0F2F5;--tx2:#A5AEBC;--tx3:#737D8C;
  --ink:#DCE1E9;--amber:#EFAA45;--amber-tx:#EFAA45;--amber-bg:#2C2415;
  --slate:#8FA2D1;--red:#EC6A5C;--red-bg:#33201E;--green:#4CC48C;--green-bg:#15291F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--page);color:var(--tx);min-height:100vh;font-variant-numeric:tabular-nums;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}

/* rail */
#rail{position:fixed;inset:0 auto 0 0;width:236px;background:linear-gradient(178deg,#1D242E 0%,#0B0E12 100%);color:#fff;display:flex;flex-direction:column;padding:20px 14px 16px;z-index:20}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand img{width:40px;height:40px;border-radius:11px;background:#fff;object-fit:cover}
.brand b{display:block;font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:#98A2B3;margin-top:1px}
nav{margin-top:14px;display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:10px;color:#B4BCC8;font-size:.88rem;font-weight:500;text-align:left;position:relative;transition:background .15s,color .15s;white-space:nowrap}
.nv svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.nv.on{background:rgba(227,154,45,.14);color:#fff;font-weight:600}
.nv.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#E39A2D}
.nv.on svg{stroke:#EFAA45}
.railfoot{margin-top:auto;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.09);font-size:.74rem;color:#98A2B3;line-height:1.6}
.railfoot b{color:#fff;font-weight:600}
.railfoot .by{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.09)}
.themebtn{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.74rem;color:#B4BCC8;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.14);width:100%}
.themebtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}

/* main */
#main{margin-left:236px;min-width:0}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:10}
h1{font-size:1.42rem;font-weight:700;letter-spacing:-.022em}
.sub{font-size:.85rem;color:var(--tx2);margin-top:1px}
.pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:.76rem;color:var(--tx2);padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--page);white-space:nowrap}
.pill b{color:var(--tx);font-weight:650}
.view{padding:22px 28px 36px;display:none}
.view.on{display:block;animation:rise .25s ease}
@keyframes rise{from{transform:translateY(5px)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}}

/* cards */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 18px;min-width:0}
.kpi{display:flex;flex-direction:column}
.kl{font-size:.8rem;font-weight:600;color:var(--tx2)}
.kc{font-size:.71rem;color:var(--tx3);margin-top:1px}
.kv{font-size:1.86rem;font-weight:750;letter-spacing:-.03em;margin:7px 0 3px;line-height:1.1}
.kd{font-size:.74rem;color:var(--tx2);min-height:2.3em}
.kd b{font-weight:650}
.up{color:var(--green)}.dn{color:var(--red)}.am{color:var(--amber-tx)}
.spark{display:block;width:100%;height:36px;margin-top:9px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
h2{font-size:.97rem;font-weight:680;letter-spacing:-.012em;line-height:1.3}
.cs{font-size:.75rem;color:var(--tx3);margin-top:2px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.take{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);font-size:.82rem;color:var(--tx2);line-height:1.55}
.take b{color:var(--tx);font-weight:650}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--tx2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--page);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{font-size:.74rem;font-weight:550;color:var(--tx2);padding:4px 10px;border-radius:7px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.selchip{display:none;align-items:center;gap:8px;font-size:.78rem;background:var(--amber-bg);color:var(--amber-tx);padding:6px 11px;border-radius:9px;margin-bottom:14px;font-weight:600;width:max-content;max-width:100%}
.selchip.on{display:inline-flex}
.selchip button{font-weight:700;text-decoration:underline;font-size:.76rem}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{font-size:.69rem;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;padding-left:0}
td:first-child{font-weight:550}
.tw{overflow-x:auto}
.tag{display:inline-block;font-size:.67rem;font-weight:650;padding:1px 7px;border-radius:99px}
.tag.s{background:var(--line2);color:var(--tx)}.tag.w{background:var(--amber-bg);color:var(--amber-tx)}
.axis{font-size:10.5px;fill:var(--tx3)}
.val{font-size:11px;font-weight:650;fill:var(--tx)}
.note{font-size:10.5px;fill:var(--tx3)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(135,145,161,.1)}
#tip{position:fixed;pointer-events:none;background:#10141A;color:#fff;font-size:.76rem;line-height:1.5;padding:8px 11px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .1s;z-index:50;max-width:270px}
#tip b{font-weight:650}
.src{font-size:.73rem;color:var(--tx3);margin-top:6px;line-height:1.55}

/* brand */
.hmark{display:flex;align-items:center;gap:13px;min-width:0}
.hmark img{width:44px;height:44px;flex:none;border-radius:50%}
.railbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px;font-size:.76rem;font-weight:600;color:#fff;padding:7px 10px;border-radius:8px;background:rgba(227,154,45,.16);border:1px solid rgba(227,154,45,.4);text-decoration:none}
.railbtn:hover{background:rgba(227,154,45,.3)}
.railbtn.sec{background:none;border-color:rgba(255,255,255,.16);color:#B4BCC8;font-weight:500}
.pagefoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:14px;border-top:1px solid var(--line);font-size:.76rem;color:var(--tx3)}
.pagefoot .l{display:flex;align-items:center;gap:9px}
.pagefoot img{width:24px;height:24px;border-radius:50%}
.pagefoot b{color:var(--tx);font-weight:650}
.pagefoot a{color:var(--amber-tx);font-weight:600;text-decoration:none;margin-left:14px}
.pagefoot a:hover{text-decoration:underline}
.simlogo{position:absolute;right:20px;top:18px;width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sim{position:relative}

/* simulator */
.sim{background:linear-gradient(130deg,#1A212B 0%,#141920 58%,#3A2C12 100%);border:0;color:#fff;padding:22px 24px}
.sim h2{font-size:1.08rem;color:#fff}.sim .cs{color:#A5AEBC;font-size:.8rem}
.sl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin:18px 0 16px}
.sl label{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;font-weight:600}
.sl label output{color:#EFAA45;font-weight:750;white-space:nowrap}
.sl small{display:block;color:#A5AEBC;font-size:.74rem;margin-top:5px;line-height:1.45}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;margin-top:10px;background:linear-gradient(90deg,#E39A2D var(--p,0%),rgba(255,255,255,.2) var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #E39A2D;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:4px solid #E39A2D}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.presets button{font-size:.76rem;font-weight:600;color:#fff;padding:5px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.22)}
.presets button:hover,.presets button.on{background:#E39A2D;border-color:#E39A2D;color:#14181E}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:13px 15px}
.tile b{display:block;font-size:1.5rem;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.tile span{font-size:.74rem;color:#A5AEBC}
.tile b.g{color:#6FE0A9}
.simnote{margin-top:14px;border-left:3px solid #E39A2D;background:rgba(0,0,0,.22);padding:10px 13px;border-radius:0 8px 8px 0;font-size:.84rem;line-height:1.5}
pre{font-family:ui-monospace,Consolas,monospace;font-size:.74rem;line-height:1.6;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;color:var(--tx)}

/* plan */
.rec{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(120px,auto);gap:15px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line2)}
.rec:first-of-type{padding-top:4px}.rec:last-of-type{border-bottom:0;padding-bottom:2px}
.rec .n{width:38px;height:38px;border-radius:11px;background:var(--amber-bg);color:var(--amber-tx);display:grid;place-items:center;font-weight:750}
.rec h3{font-size:.93rem;font-weight:670;letter-spacing:-.01em}
.rec p{font-size:.83rem;color:var(--tx2);margin-top:3px;line-height:1.55}
.rec .fig{text-align:right;font-size:1.12rem;font-weight:750;letter-spacing:-.02em}
.rec .fig small{display:block;font-size:.69rem;font-weight:500;color:var(--tx3);letter-spacing:0}
.list{list-style:none;font-size:.83rem;color:var(--tx2)}
.list li{padding:8px 0;border-bottom:1px solid var(--line2);line-height:1.5}
.list li:last-child{border:0;padding-bottom:0}
.list b{color:var(--tx);font-weight:650}

@media(max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pills{display:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .hmark img{width:36px;height:36px}.simlogo{width:34px;height:34px;right:14px;top:14px}
  #rail{position:sticky;top:0;bottom:auto;right:0;width:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:8px;overflow-x:auto}
  .brand{border:0;padding:0}.brand div,.railfoot{display:none}.brand img{width:32px;height:32px}
  nav{flex-direction:row;margin:0}.nv{padding:8px 10px;font-size:.8rem}.nv.on::before{display:none}
  #main{margin-left:0}header{position:static;padding:14px 16px}.view{padding:14px 16px 28px}
  .g5,.g4,.g3,.g2,.g21{grid-template-columns:minmax(0,1fr)}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.sl{grid-template-columns:minmax(0,1fr)}
  .rec{grid-template-columns:42px minmax(0,1fr)}.rec .fig{grid-column:2;text-align:left}
}
@media(max-width:480px){.g5{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

  const w=Math.max(el.clientWidth,300),L=44,R=14,T=12,B=34,mxX=Math.ceil(Math.max(...pts.map(p=>p.x))/5e6)*5e6,yMin=0,yMax=.4;
  const X=v=>L+v/mxX*(w-L-R),Y=v=>T+(yMax-Math.min(Math.max(v,yMin),yMax))/(yMax-yMin)*(h-T-B);
  let g='';
  [0,.1,.2,.3,.4].forEach(v=>{g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)"/><text class="axis" x="${L-7}" y="${Y(v)+3.5}" text-anchor="end">${v*100}%</text>`});
  for(let v=0;v<=mxX;v+=5e6)g+=`<text class="axis" x="${X(v)}" y="${h-B+15}" text-anchor="middle">${money(v,0)}</text>`;
  g+=`<text class="note" x="${L+(w-L-R)/2}" y="${h-3}" text-anchor="middle">Store sales</text>`;
  g+=`<line x1="${L}" x2="${w-R}" y1="${Y(GM)}" y2="${Y(GM)}" stroke="var(--tx3)" stroke-dasharray="4 3"/><text class="note" x="${w-R}" y="${Y(GM)-5}" text-anchor="end">Company ${pct(GM)}</text>`;
  pts.forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.hi?6.5:4.5}" fill="${p.c}" fill-opacity="${p.hi?.95:.62}" stroke="var(--card)" data-tip="${esc(p.tip)}"/>`;
    if(p.hi)g+=`<text class="val" x="${X(p.x)+(X(p.x)>w-110?-10:10)}" y="${Y(p.y)+4}" text-anchor="${X(p.x)>w-110?'end':'start'}" style="font-size:10.5px">${esc(p.hi)}</text>`});
  el.innerHTML=NS(w,h,g,'store sales against margin');
}

    tips:i=>`<b>${M[i].l} 2016</b><br>Sold ${units(M[i].su)}<br>Ordered ${units(M[i].pou)}<br>Received ${units(M[i].rcu)}`});
  cols(c_n,M.map(x=>{const v=x.rcu-x.su;return{l:x.l,v,c:v<0?'var(--red)':'var(--tx3)'}}),{neg:true,fmt:(v)=>units(v,1)});
  cols(c_m,M.map(x=>{const v=(x.s-x.rc)/x.s;return{l:x.l,v,c:v<.2?'var(--red)':v>.35?'var(--green)':'var(--ink)'}}),{fmt:(v)=>pct(v,0),ref:{v:GM,l:'year '+pct(GM)}});
};

const sim={disc:2,gap:25};
R.whatif=()=>`
  <div class="card sim" style="margin-bottom:14px">
   <img class="simlogo" src="docs/logo.png" alt=""/>
   <h2>What is a better deal worth?</h2><div class="cs">Move either slider. Everything recalculates from the 2016 figures.</div>
   <div class="sl">
    <div><label for="s_d">Lower prices from the top five vendors <output id="o_d"></output></label><input type="range" id="s_d" min="0" max="5" step=".5" value="${sim.disc}"/><small>Applied to ${money(TOP5)} of purchases from Diageo, Martignetti, Jim Beam, Pernod Ricard and Bacardi.</small></div>
    <div><label for="s_g">Close the gap for stores below the median <output id="o_g"></output></label><input type="range" id="s_g" min="0" max="50" step="5" value="${sim.gap}"/><small>${BEHIND.length} stores sit ${money(GAP)} below the ${money(MED)} median. Extra sales earn the ${pct(GM)} company margin.</small></div>
   </div>
   <div class="presets" id="pre">
    <button type="button" data-d="1" data-g="10">Cautious</button><button type="button" data-d="2" data-g="25">Base case</button><button type="button" data-d="4" data-g="50">Stretch</button><button type="button" data-d="0" data-g="0">Today</button>
   </div>
   <div class="tiles">
    <div class="tile"><b id="t_gp"></b><span>Scenario gross profit</span></div>
    <div class="tile"><b id="t_up" class="g"></b><span>Added to gross profit</span></div>
    <div class="tile"><b id="t_m"></b><span>Scenario margin (now ${pct(GM,2)})</span></div>
    <div class="tile"><b id="t_s"></b><span>Added sales</span></div>
   </div>
   <div class="simnote" id="t_n"></div>
  </div>
  <div class="grid g2">
   <div class="card"><div class="ch"><div><h2>Where the gain comes from</h2><div class="cs">Added gross profit by lever</div></div></div><div class="chart" id="c_w"></div>
    <p class="take"><b>This is a sizing tool, not a forecast.</b> The percentages are assumptions to test, and the data has no vendor contract terms or store floor space behind them.</p></div>
   <div class="card"><div class="ch"><div><h2>How it is calculated</h2><div class="cs">The same logic as DAX measures</div></div></div>
<pre>Vendor Saving =
    [Top 5 Vendor Purchases] * [Vendor Discount Value]

Store Uplift Sales =
    SUMX (
        FILTER ( VALUES ( Store ), [Sales] &lt; [Median Store Sales] ),
        [Median Store Sales] - [Sales]
    ) * [Gap Closed Value]

Scenario Gross Profit =
    [Gross Profit] + [Vendor Saving]
        + [Store Uplift Sales] * [Gross Profit Margin]</pre>
   </div>
  </div>`;
R.whatif.after=()=>{
  const d=s_d,g=s_g,fill=e=>e.style.setProperty('--p',((e.value-e.min)/(e.max-e.min)*100)+'%');
  const calc=()=>{
    sim.disc=+d.value;sim.gap=+g.value;fill(d);fill(g);
    o_d.textContent=sim.disc.toFixed(1)+'%';o_g.textContent=sim.gap+'%';
    const save=TOP5*sim.disc/100,xs=GAP*sim.gap/100,xg=xs*GM,up=save+xg,gp=GP+up,m=gp/(S+xs);
    t_gp.textContent=money(gp,2);t_up.textContent='+'+money(up,2);t_m.textContent=pct(m,2);t_s.textContent='+'+money(xs,2);
    t_n.innerHTML=up===0?'This is 2016 as it happened. Move a slider or pick a scenario.':`<b>${sim.disc}% off the top five and ${sim.gap}% of the store gap closed add ${money(up,2)} of gross profit, up ${pct(up/GP)}.</b> ${save>=xg?'Vendor terms do more of the work here, and they need no new customers.':'Store performance does more of the work here, though it takes longer to deliver.'}`;
    document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('on',+b.dataset.d===sim.disc&&+b.dataset.g===sim.gap));
    hbars(c_w,[{l:'Vendor terms',v:save,c:'var(--amber)',tip:`<b>Vendor terms</b><br>${sim.disc}% of ${money(TOP5)} = ${money(save,2)}`},{l:'Store uplift',v:xg,c:'var(--ink)',tip:`<b>Store uplift</b><br>${money(xs,2)} added sales at ${pct(GM)} = ${money(xg,2)}`}].map(r=>({...r,v:Math.max(r.v,0)})),{lw:96,rh:44,fmt:v=>money(v,2)});
  };
  d.oninput=calc;g.oninput=calc;
  document.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>{d.value=b.dataset.d;g.value=b.dataset.g;calc()});
  calc();
};

R.plan=()=>{
  const two=(D.sizes[0].sp+D.sizes[0].wi+D.sizes[1].sp+D.sizes[1].wi);
  const dec=M[11],m50=ST.find(s=>s.id===50);
  const rec=(n,t,p,f,fs)=>`<div class="rec"><div class="n">${n}</div><div><h3>${t}</h3><p>${p}</p></div><div class="fig">${f}<small>${fs}</small></div></div>`;
  return `<div class="grid g21">
   <div class="card"><div class="ch"><div><h2>Five actions, in order</h2><div class="cs">Each one is tied to a figure in this dashboard</div></div></div>
    ${rec(1,'Use vendor volume to negotiate',`The top five vendors are ${pct(TOP5/P,0)} of purchases and Diageo alone is ${pct(D.vendTop[0][1]/P)}. Ask for better terms, and line up a back-up supplier at the same time.`,'+'+money(TOP5*.02),'at 2% off the top five')}
    ${rec(2,'Find out what is wrong at Store 50',`It is the sixth-largest store by sales, with a ${pct(m50.m)} margin against ${pct(GM)} for the company. Check its stock level and pricing first.`,money(m50.s*(GM-m50.m)),'margin gap in dollars')}
    ${rec(3,'Copy what the best stores do',`Best store ${money(ST[0].s)}, median ${money(MED)}. Ask managers in Doncaster and Pitmerden what they do differently, then share it with the ${BEHIND.length} stores below the median.`,'+'+money(GAP*.25*GM),'closing 25% of the gap')}
    ${rec(4,'Protect the two main sizes',`750mL and 1750mL are ${pct(two/S,0)} of sales. Keep them in stock through the summer and holiday peaks, and review any price or cost change on them first.`,money(two),'sales at stake')}
    ${rec(5,'Check holiday stock timing',`December sold ${units(dec.su)} units and received ${units(dec.rcu)}. Stock still fell, so test whether more arriving by November would prevent stock-outs. This needs stock-out data to size.`,units(dec.rcu-dec.su),'December units, on receipts')}
   </div>
   <div>
    <div class="card" style="margin-bottom:14px"><h2 style="margin-bottom:6px">What I found</h2><ul class="list">
     <li><b>Sales rise through the year.</b> The second half beat the first by ${pct(H2/H1-1)}, with peaks in July and December.</li>
     <li><b>Results depend on the date you use.</b> December looks like a ${pct((dec.s-dec.po)/dec.s,0)} margin by order date and ${pct((dec.s-dec.rc)/dec.s,0)} by receipt date.</li>
     <li><b>Sales are concentrated.</b> The top 10 stores make ${pct(sum(ST.slice(0,10).map(s=>s.s))/S,0)} of sales. Two sizes make ${pct(two/S,0)}.</li>
    </ul></div>
    <div class="card"><h2 style="margin-bottom:6px">What this data cannot say</h2><ul class="list">
     <li><b>Margin is an estimate.</b> It is sales minus purchases for the year, not sales minus the cost of what was sold.</li>
     <li><b>No prior year.</b> There is only 2016, so the comparisons are within the year.</li>
     <li><b>No stock-outs or monthly counts.</b> Stock was counted at the start and end of the year only, and lost sales are invisible.</li>
     <li><b>No reasons.</b> The data shows what happened, so the first step on any store is to talk to its manager.</li>
    </ul></div>
   </div>
  </div>
  <p class="src">Source: SalesFINAL and PurchasesFINAL 2016 CSVs (${D.rows[0].toLocaleString()} and ${D.rows[1].toLocaleString()} rows). Annual purchases of ${money(P,2)} include ${money(D.dec15,2)} ordered in December 2015. Totals match the Power BI model.</p>`;
};

/* ---------- shell ---------- */
const FOOT=`<div class="pagefoot"><div class="l"><img src="docs/logo.png" alt=""/><span><b>JustDrinks LTD</b>. Web version of the analysis, built with HTML, CSS and JavaScript by Bih Brandy Sango</span></div><div><a href="https://github.com/bihbrandysango-cloud/justdrinks-ltd-analysis#report-pages" target="_blank" rel="noopener">See the Power BI report ↗</a><a href="https://github.com/bihbrandysango-cloud/justdrinks-ltd-analysis" target="_blank" rel="noopener">GitHub ↗</a></div></div>`;
const views=document.getElementById('views'),nav=document.getElementById('nav');
nav.innerHTML=PAGES.map(p=>`<button type="button" class="nv" data-p="${p.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic[p.i]}</svg>${p.n}</button>`).join('');
views.innerHTML=PAGES.map(p=>`<section class="view" id="v_${p.id}" aria-label="${p.t}"></section>`).join('');
document.getElementById('pills').innerHTML=`<span class="pill">Sales <b>${money(S)}</b></span><span class="pill">Profit <b>${money(GP)}</b></span><span class="pill">Margin <b>${pct(GM)}</b></span><span class="pill">Stores <b>80</b></span>`;
function render(){
  const p=PAGES.find(x=>x.id===state.view);
  h.textContent=p.t;hs.textContent=p.s;
  nav.querySelectorAll('.nv').forEach(b=>{const on=b.dataset.p===p.id;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v_'+p.id));
  const v=document.getElementById('v_'+p.id);v.innerHTML=R[p.id]()+FOOT;
  v.querySelectorAll('[data-seg]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{state[s.dataset.seg]=b.dataset.v;render()}));
  if(R[p.id].after)R[p.id].after();
}
nav.onclick=e=>{const b=e.target.closest('.nv');if(!b)return;state.view=b.dataset.p;history.replaceState(null,'','#'+state.view);render();window.scrollTo(0,0)};
const start=location.hash.slice(1);if(PAGES.some(p=>p.id===start))state.view=start;
/* tooltip */
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}
  tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1;const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-8)+'px';tip.style.top=Math.max(e.clientY-r.height-12,8)+'px'});
/* theme */
const themeBtn=document.getElementById('theme');
function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='dark'?'☀ Light mode':'☾ Dark mode'}
let saved=null;try{saved=localStorage.getItem('jd-theme')}catch(e){}
setTheme(saved||'light');
themeBtn.onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(t);try{localStorage.setItem('jd-theme',t)}catch(e){}render()};
let rt;let lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth===lastW)return;lastW=innerWidth;clearTimeout(rt);rt=setTimeout(render,120)});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
</script>
